<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; media-src blob: https:; base-uri 'none'; form-action 'none'">
<title>Запись экрана</title>
<style>
  :root { --bg:#ffffff; --text:#1c1c1a; --muted:#6b6b66; --border:rgba(0,0,0,.12); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1d; --text:#f1efe8; --muted:#a3a29b; --border:rgba(255,255,255,.14); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,'Segoe UI',sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px; }
  video { width:100%; max-height:75vh; background:#000; border-radius:12px; display:block; }
  h1 { font-size:18px; font-weight:500; margin:16px 0 4px; }
  .meta { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  a.btn { color:var(--text); border:.5px solid var(--border); border-radius:8px; padding:6px 14px; text-decoration:none; font-size:13px; }
  #msg { margin-top:80px; text-align:center; color:var(--muted); }
  #bar { width:240px; height:6px; border-radius:3px; background:var(--border); margin:12px auto 0; overflow:hidden; }
  #bar div { height:100%; width:0; background:var(--text); transition:width .2s; }
</style>
</head>
<body>
<main>
  <div id="msg">Загрузка…</div>
  <div id="bar" hidden><div></div></div>
  <div id="view" hidden>
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="row">
      <div><h1 id="title"></h1><div class="meta" id="meta"></div></div>
      <a class="btn" id="download" download="screen-recording.mp4">Скачать</a>
    </div>
  </div>
</main>
<script>
(async function () {
  var msg = document.getElementById('msg');
  var bar = document.getElementById('bar');
  function fail(text) { msg.textContent = text; bar.hidden = true; }

  function b64(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  // Формат SRV1: заголовок 24 байта, затем блоки AES-256-GCM (шифртекст + тег 16 байт).
  // Должен совпадать с src/main/vcrypto.ts.
  async function decryptBlob(key, data) {
    if (data.length < 40) throw new Error('corrupt');
    if (data[0] !== 83 || data[1] !== 82 || data[2] !== 86 || data[3] !== 49) throw new Error('format');
    var dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
    var chunkSize = dv.getUint32(4);
    var hi = dv.getUint32(8), lo = dv.getUint32(12);
    if (chunkSize === 0 || chunkSize > 16777216 || hi > 255) throw new Error('corrupt');
    var plainSize = hi * 4294967296 + lo;
    var count = Math.max(1, Math.ceil(plainSize / chunkSize));
    if (data.length !== 24 + plainSize + count * 16) throw new Error('corrupt');
    var header = data.subarray(0, 24);
    var out = new Uint8Array(plainSize);
    var offset = 24, written = 0;
    for (var i = 0; i < count; i++) {
      var plainLen = Math.min(chunkSize, plainSize - i * chunkSize);
      var iv = new Uint8Array(12);
      iv.set(header.subarray(16, 24), 0);
      new DataView(iv.buffer).setUint32(8, i);
      var aad = new Uint8Array(29);
      aad.set(header, 0);
      new DataView(aad.buffer).setUint32(24, i);
      aad[28] = i === count - 1 ? 1 : 0;
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv, additionalData: aad, tagLength: 128 },
        key,
        data.subarray(offset, offset + plainLen + 16)
      );
      out.set(new Uint8Array(plain), written);
      written += plainLen;
      offset += plainLen + 16;
    }
    return out;
  }

  async function download(url) {
    var res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    var total = Number(res.headers.get('content-length')) || 0;
    var reader = res.body.getReader();
    var parts = [], got = 0;
    for (;;) {
      var r = await reader.read();
      if (r.done) break;
      parts.push(r.value);
      got += r.value.length;
      if (total) bar.firstChild.style.width = Math.min(99, Math.round(got / total * 100)) + '%';
    }
    var all = new Uint8Array(got), pos = 0;
    for (var i = 0; i < parts.length; i++) { all.set(parts[i], pos); pos += parts[i].length; }
    return all;
  }

  function show(title, meta, src) {
    document.title = title || 'Запись экрана';
    document.getElementById('title').textContent = title || 'Запись экрана';
    document.getElementById('meta').textContent = meta;
    document.getElementById('player').src = src;
    document.getElementById('download').href = src;
    msg.hidden = true;
    bar.hidden = true;
    document.getElementById('view').hidden = false;
  }

  function metaLine(d) {
    var parts = [];
    if (d.date) parts.push(new Date(d.date).toLocaleDateString());
    if (d.duration) parts.push(Math.floor(d.duration / 60) + ':' + String(d.duration % 60).padStart(2, '0'));
    if (d.size) parts.push((d.size / 1048576).toFixed(1) + ' МБ');
    return parts.join(' · ');
  }

  var id = new URLSearchParams(location.search).get('v');
  if (!id || !/^[A-Za-z0-9_-]{8,64}$/.test(id)) return fail('Видео не найдено');

  var info;
  try {
    var res = await fetch('v/' + id + '.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    info = await res.json();
  } catch (e) {
    return fail('Видео не найдено или ещё публикуется. Обновите страницу через минуту.');
  }

  // Старый формат: видео лежит открыто в релизе GitHub.
  if (info.src) {
    if (!/^https:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\/[^?#]+$/.test(info.src)) return fail('Видео не найдено');
    return show(info.title, metaLine(info), info.src);
  }

  // Новый формат: видео зашифровано, ключ только во фрагменте ссылки (после #), на сервер он не уходит.
  var k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k || !/^[A-Za-z0-9_-]{43}$/.test(k)) return fail('В ссылке нет ключа. Откройте ссылку целиком, вместе с частью после знака #.');
  if (info.v !== 1 || typeof info.meta !== 'string') return fail('Видео не найдено');
  if (!window.crypto || !crypto.subtle) return fail('Этот браузер не умеет расшифровывать видео. Откройте ссылку по https в современном браузере.');

  try {
    var key = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    var meta = JSON.parse(new TextDecoder().decode(await decryptBlob(key, b64(info.meta))));
    if (meta.exp && Date.now() >= meta.exp) return fail('Срок действия этой ссылки истёк, видео удалено.');
    msg.textContent = 'Загружаем и расшифровываем видео…';
    bar.hidden = false;
    var encrypted = await download('v/' + id + '.bin');
    var video = await decryptBlob(key, encrypted);
    show(meta.title, metaLine(meta), URL.createObjectURL(new Blob([video], { type: 'video/mp4' })));
  } catch (e) {
    fail('Не удалось расшифровать видео. Возможно, ссылка скопирована не полностью или файл повреждён.');
  }
})();
</script>
</body>
</html>
